# Render.com blueprint: one web service with a persistent disk for SQLite.
# Set STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET in the Render dashboard (marked sync: false below).
services:
  - type: web
    name: invitalia
    runtime: docker
    rootDir: INVITALIA
    dockerfilePath: ./server/Dockerfile
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: invitalia-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BASE_URL
        value: https://invitalia.co
      - key: DATABASE_PATH
        value: /data/invitalia.db
      - key: PRICE_AMOUNT
        value: "2900"
      - key: PRICE_CURRENCY
        value: eur
      - key: TRUST_PROXY
        value: "1"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
