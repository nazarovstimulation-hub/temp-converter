# Render.com Blueprint for INVITALIA.co
# One web service (Node 22, Docker) with a persistent disk for the SQLite database.
# Deploy: https://render.com/deploy?repo=https://github.com/nazarovstimulation-hub/temp-converter
# After the first deploy, set STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET in the Render dashboard
# (they are marked sync: false so Render asks for them during Blueprint setup) and add the custom domain.
services:
  - type: web
    name: invitalia
    runtime: docker
    region: frankfurt
    plan: starter
    branch: claude/invitalia-logo-concepts-jukw3p   # switch to main once the branch is merged
    rootDir: INVITALIA
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /api/health
    disk:
      name: invitalia-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BASE_URL
        value: https://invitalia.co
      - key: DATABASE_PATH
        value: /data/invitalia.db
      - key: SITE_DIR
        value: ../site
      - key: PRICE_AMOUNT
        value: "2900"
      - key: PRICE_CURRENCY
        value: eur
      - key: TRUST_PROXY
        value: "1"
      - key: CORS_ORIGINS
        value: https://invitalia.co,https://www.invitalia.co
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
