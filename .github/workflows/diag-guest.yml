name: Diagnose INVITALIA guest page

# Manual diagnostics for the guest page on invitalia.co: served assets vs repo, API, browser console.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/diag-guest.yml", "INVITALIA/server/diag-guest.mjs"]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Diagnose
        run: |
          cd INVITALIA/server
          npm i --no-save --silent playwright@1.49.1
          npx playwright install --with-deps chromium > /dev/null
          node diag-guest.mjs https://invitalia.co
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: diag-guest, path: INVITALIA/server/diag-guest.png, if-no-files-found: ignore }
