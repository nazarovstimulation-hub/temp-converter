name: Check INVITALIA domain

# Manual diagnostics: DNS, HTTPS and API health for invitalia.co, run from GitHub's network.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/check-domain.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: DNS
        run: |
          echo "== NS (system resolver)"; dig NS invitalia.co +short || true
          echo "== NS via 1.1.1.1"; dig NS invitalia.co @1.1.1.1 +short || true
          echo "== NS via 8.8.8.8"; dig NS invitalia.co @8.8.8.8 +short || true
          echo "== NS at the .co registry"; dig NS invitalia.co @a.cctld.co +short || dig NS invitalia.co @ns1.cctld.co +short || true
          echo "== A invitalia.co"; dig A invitalia.co +short || true
          echo "== A www.invitalia.co"; dig A www.invitalia.co +short || true
          echo "== A via Cloudflare NS directly"; dig A invitalia.co @lina.ns.cloudflare.com +short || true
          echo "== SOA"; dig SOA invitalia.co +short || true
      - name: HTTPS
        run: |
          echo "== invitalia.co"; curl -sS -o /dev/null -w 'HTTP %{http_code}\n' --max-time 20 https://invitalia.co/ || true
          echo "== api/health"; curl -sS --max-time 20 https://invitalia.co/api/health || true; echo
          echo "== www"; curl -sS -o /dev/null -w 'HTTP %{http_code}\n' --max-time 20 https://www.invitalia.co/ || true
          echo "== workers.dev"; curl -sS --max-time 20 https://invitalia.nazarovstimulation.workers.dev/api/health || true; echo
      - name: check-deploy.js
        run: node INVITALIA/server/check-deploy.js invitalia.co || true
      - name: Gallery (33 templates and their cover photos)
        run: |
          node -e '
            const T = require("./INVITALIA/site/assets/templates.js");
            (async () => {
              const html = await (await fetch("https://invitalia.co/")).text();
              const cards = (html.match(/<article class="tpl"/g) || []).length;
              console.log(`gallery cards on invitalia.co: ${cards} (expected ${T.list.length})`);
              for (const name of ["Promesa", "Felicidad", "Amalfi"]) console.log(`${html.includes(">" + name + "<") ? "ok" : "MISSING"}  card ${name}`);
              let bad = 0;
              for (const t of T.list) {
                for (const f of [t.cover, t.mini]) {
                  const r = await fetch("https://invitalia.co/" + f, { method: "HEAD" });
                  const len = r.headers.get("content-length");
                  if (r.status !== 200) bad++;
                  console.log(`${r.status === 200 ? "ok " : "BAD"} ${r.status} ${f} ${len ? len + " bytes" : ""}`);
                }
              }
              const ed = await (await fetch("https://invitalia.co/editor.html")).text();
              console.log(`editor swatches: ${(ed.match(/class="sw"/g) || []).length}`);
              const tj = await fetch("https://invitalia.co/assets/templates.js"); console.log(`templates.js: HTTP ${tj.status}`);
              if (bad || cards !== T.list.length) { console.log(`PROBLEMS: ${bad} missing files`); process.exit(1); }
              console.log("gallery ok");
            })();
          '
